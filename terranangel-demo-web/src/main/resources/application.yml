# TerranAngel 示例配置——默认是"最简启动"。

# ===== 服务端口 =====
# 优先使用环境变量 PORT（Render 等云平台会注入，默认值 10000），
# 本地没有 PORT 时回落到 8080。
# 绑定 0.0.0.0 是 Spring Boot 默认行为，无需额外配置。
server:
  port: ${PORT:8080}

# ===== 能力开关（terranangel 前缀）=====
# 配了 enabled: true 才启用对应能力，没配则完全不初始化，Spring 照常启动。
terranangel:
  # ===== JWT 配置（Spring Security 认证使用）=====
  jwt:
    # 签名密钥：HS256 要求至少 32 字节。
    # 生产环境务必换成随机值并通过环境变量注入，不要提交到仓库。
    secret: terranangel-jwt-secret-key-change-me-in-production-0123456789abcdef
    # 令牌有效期（小时）
    expiration-hours: 2
  # gRPC 开关
  grpc:
    enabled: false
  # OpenFeign 开关
  feign:
    enabled: false
    url: http://127.0.0.1:8080
  # Kafka 开关（默认关闭）
  kafka:
    enabled: false        # false 时不加载 Kafka 消费，应用照常启动
    # 本地没启动 Kafka，这里不配 bootstrap-servers
    # bootstrap-servers: 127.0.0.1:9092
  # ===== 数据访问开关（默认全关：不配置不连库，应用照常启动）=====
  # 两个数据源完全独立，各配一套，可以同时开启。
  # 业务上没有交集，所以不存在跨库事务问题。
  datasource:
    # JPA（Hibernate）→ PostgreSQL（当前指向 Supabase 线上库，经 Session Pooler 连接）
    # 注意：库名固定用 postgres，表建在它的 public schema —— Supabase 后台只认这个库，
    # 只有这样 Dashboard → Table Editor 里才看得到表。
    postgres:
      enabled: true        # true 才启用
      # 【为什么用 Pooler 而不是直连】
      # 直连域名 db.<ref>.supabase.co 现在只有 IPv6（IPv4 要额外付费买 add-on），
      # Render 这类只有 IPv4 出站的平台连不上；
      # pooler 域名 aws-0-<region>.pooler.supabase.com 是 IPv4，且免费。
      # 端口固定用 5432（Session 模式），支持 prepared statement；
      # 不要改成事务模式 6543 —— Hibernate 用 prepared statement，会直接报错。
      url: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      # 【用户名必须带 .<project-ref> 后缀】
      # pooler 是共享的（同一个 host 服务该 region 下所有项目），Supavisor 靠这个后缀
      # 把连接路由到对应项目；写成裸 postgres 会认证失败。
      username: postgres.vqcqxxcbxcwtcdhgnwup
      # 临时明文，仅为本地联调；测试完请改成环境变量并轮换密码
      password: gh1ki6yapDYGnJIM
      max-pool-size: 10
      generate-ddl: true  # 自动建表（演示用，生产建议关）
    # MyBatis-Plus → MySQL
    mysql:
      enabled: false       # true 才启用
      url: jdbc:mysql://127.0.0.1:3306/terranangel?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      max-pool-size: 10
  # 缓存开关（默认关闭：不配置不初始化，应用照常启动）
  # Caffeine（本地）与 Redis（分布式）各自独立，业务方法上用 cacheManager 指定用哪个；
  # 不指定时走默认的 redisCacheManager（见 RedisCacheConfig 的 @Primary）。
  cache:
    enabled: false        # true 才启用 Spring Cache
    ttl-seconds: 3600     # 默认过期时间（秒）
    max-size: 1000        # Caffeine 最大条目数
    redis:
      host: 127.0.0.1
      port: 6379
  # Elasticsearch 开关（默认关闭：不配置不初始化，应用照常启动）
  es:
    enabled: false         # true 才启用 Elasticsearch
    uris: https://localhost:9200    # ES 8+ 默认开 HTTPS
    # ES 8+ 默认开启安全认证，填首次启动时生成的密码
    username: elastic
    password: Xxl+51vt0_KmTX=E2ccY

spring:
  application:
    name: terranangel-demo-web     # 服务名，注册到注册中心时用
  # 关闭 Spring Cloud 兼容性检查：
  # Spring Cloud 2025.1 官方只支持 Spring Boot 4.0.x，而本项目用 4.1.0，
  # 检查器会阻止启动。关闭后让它在 4.1.0 上运行（4.1 与 4.0 差异小，实测可跑）。
  cloud:
    compatibility-verifier:
      enabled: false
    # 注册中心：Consul（默认关闭，不用就不初始化、不刷日志）
    consul:
      host: 127.0.0.1     # Consul 服务端地址
      port: 10002         # Consul 服务端端口
      discovery:
        # 注册中心开关：false 时整个 Consul 发现功能关闭（不注册、不查询、不刷日志）
        enabled: false
        # 关键：关闭 ConsulCatalogWatch 定时查询任务（这才是刷 ERROR 日志的源头）
        catalog-services-watch:
          enabled: false
        # 注册到 Consul，用 IP 而不是主机名（避免 terranangel 解析失败）
        prefer-ip-address: true
        instance-id: ${spring.application.name}
        # 注册开关：跟随 enabled，默认不注册
        register: false
  grpc:
    server:
      port: 9090          # gRPC 服务端端口
    client:
      channels:
        hello:
          address: 127.0.0.1:9090   # 客户端连接的 gRPC 服务地址

# Actuator 健康检查：不检查 Consul（Consul 按需加载，没启用就不该影响健康状态）
management:
  health:
    consul:
      enabled: false
